[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bracketforge"
version = "0.1.0"
description = "A reusable tournament fixture-scheduling library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["bracketforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
